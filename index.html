<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMI EMC｜クライアント確認</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#332b1f 0,transparent 36%),#0c0b09;color:#eee9df;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif}.shell{min-height:100svh;padding:48px 22px;display:grid;place-items:center}.card{width:min(100%,520px);padding:clamp(32px,6vw,60px);border:1px solid #6f5e40;background:#100e0beb;box-shadow:0 28px 80px #0006}.eyebrow{color:#c5a365;font:500 12px/1.4 Georgia,serif;letter-spacing:.22em}h1{margin:18px 0 12px;font:400 clamp(30px,5vw,54px)/1.3 Georgia,"Yu Mincho",serif}.intro{color:#aaa296;line-height:1.8}form{margin-top:36px}label{display:block;margin-bottom:10px;color:#c5a365;font-size:11px;letter-spacing:.18em}input{width:100%;height:54px;padding:0 16px;border:1px solid #615640;background:#15120e;color:#fff;font-size:18px;outline:none}input:focus{border-color:#c5a365}button{width:100%;height:54px;margin-top:18px;border:0;background:#b79761;color:#111;font-weight:700;cursor:pointer}.error{color:#ef9c8f;font-size:13px}.pages{width:min(100%,1100px);display:none}.pages header{margin-bottom:44px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid a{min-height:230px;padding:28px;display:flex;flex-direction:column;border:1px solid #4e4434;background:#14110d;color:inherit;text-decoration:none}.grid span{color:#c5a365;font-family:Georgia,serif;font-style:italic}.grid strong{margin:auto 0 14px;font:400 clamp(24px,3vw,36px)/1.3 Georgia,"Yu Mincho",serif}.grid small{color:#aaa296;line-height:1.7}@media(max-width:760px){.grid{grid-template-columns:1fr}.grid a{min-height:180px}}</style></head><body><main class="shell"><section class="card" id="gate"><p class="eyebrow">JMI EMC / CLIENT REVIEW</p><h1>クライアント確認ページ</h1><p class="intro">閲覧用パスワードを入力してください。</p><form id="form"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" autofocus><p class="error" id="error"></p><button>確認ページを開く</button></form></section><section class="pages" id="pages"><header><p class="eyebrow">JMI EMC / CLIENT REVIEW</p><h1>確認ページ一覧</h1><p class="intro">PC・スマートフォンの両方でご確認いただけます。</p></header><div class="grid"><a href="lp.html"><span>01</span><strong>LPトップ</strong><small>JMI EMC 次世代経営者育成プログラム</small></a><a href="report.html"><span>02</span><strong>開催レポート</strong><small>JMI EMC第37期 開講3日間レポート</small></a><a href="interview.html"><span>03</span><strong>インタビュー記事</strong><small>参加者・関係者インタビュー</small></a></div></section></main><script>const expected='c036306df347333d48679c559144e20a7f580369e66bed136597d9786f8556f5';const gate=document.querySelector('#gate'),pages=document.querySelector('#pages');function show(){gate.style.display='none';pages.style.display='block'}if(sessionStorage.getItem('jmi-review-auth')===expected)show();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const data=new TextEncoder().encode(document.querySelector('#password').value),hash=await crypto.subtle.digest('SHA-256',data),candidate=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');if(candidate===expected){sessionStorage.setItem('jmi-review-auth',candidate);show()}else document.querySelector('#error').textContent='パスワードが正しくありません。'};</script></body></html>
